<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Water</title>
<script>
/* 主题初始化：localStorage['water-theme'] = light | dark | system（缺省跟随系统） */
(function(){try{
  var t = localStorage.getItem('water-theme');
  if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
}catch(e){}})();
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
