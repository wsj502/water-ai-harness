# Water 一体化部署：server(API+SSE) + Web(静态托管) + 插件
# 用法：
#   cp .env.example .env   # 填入 ZHIPU_API_KEY（.env 已被 .gitignore 排除）
#   docker compose up -d --build
#   open http://127.0.0.1:3210
services:
  water:
    build: .
    image: water:0.11.2
    container_name: water
    ports:
      - "3210:3210"
    environment:
      # 凭据只走环境变量；生产建议换 docker secret 或 vault 注入
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:?请在 .env 里配置 ZHIPU_API_KEY}
      WATER_PROTOCOL: ${WATER_PROTOCOL:-anthropic}
      WATER_BASE_URL: ${WATER_BASE_URL:-https://open.bigmodel.cn/api/anthropic}
      WATER_MODEL: ${WATER_MODEL:-glm-4.6}
    volumes:
      # Agent 的工作区：把宿主机项目目录挂进去
      - ${WATER_WORKSPACE:-./workspace}:/workspace
      # #97 补充：workspace 挂载会遮蔽镜像 /workspace 下的内容（Docker 挂载点覆盖镜像层），
      # demo MCP 脚本必须以单文件挂载进入——mcp.json 里的相对路径 scripts/... 以 /workspace 解析
      - ./scripts/demo-mcp-server.mjs:/workspace/scripts/demo-mcp-server.mjs:ro
      # #99 配置与数据分离：DB 落在命名卷（可写、跨重建存活）；
      # 此前整目录 ro 挂载把 sessions.db 也变只读——保存静默失败，schema 迁移启动即崩
      - water-data:/workspace/.water
      # 插件配置：单文件只读（更具体路径覆盖上面的卷；mcp.json 在仓库跟踪中）
      # 注意：bind 单文件要求源必须存在，缺失时 docker 会创建同名目录导致挂载异常
      - ./.water/mcp.json:/workspace/.water/mcp.json:ro
    restart: unless-stopped
    read_only: false # /workspace 需要写权限（Agent 改代码），镜像层本身无可写需求

volumes:
  water-data:
